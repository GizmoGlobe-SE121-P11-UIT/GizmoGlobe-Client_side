name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create .env from .env.web (public keys only)
        run: |
          cp .env.web .env
          echo "✓ Created .env from .env.web"
          head -5 .env
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Build Flutter web
        run: flutter build web --release
      - name: Verify and copy .env to build output
        run: |
          echo "Checking if .env exists in build/web/assets/..."
          ls -la build/web/assets/ | grep -E '\.env|AssetManifest' || echo "No .env found in assets"
          echo "Copying .env to build output..."
          cp .env build/web/.env
          cp .env build/web/assets/.env
          echo "✓ Verification:"
          ls -la build/web/.env
          ls -la build/web/assets/.env
          echo "Content preview:"
          head -3 build/web/.env
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SE121P11_GIZMOGLOBE }}
          channelId: live
          projectId: se121p11-gizmoglobe
